<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dff4ff">
  <title>Pop! Balloon Party</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,700;9..144,800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #18324b;
      --muted: #6d8498;
      --sky: #dff4ff;
      --white: #fffefa;
      --coral: #ff6f61;
      --blue: #4c91ed;
      --yellow: #ffc94f;
      --mint: #56c9a6;
      --pink: #ed7fac;
      --lilac: #9a83e9;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      padding: 28px 18px;
      color: var(--ink);
      background-color: var(--sky);
      background-image: radial-gradient(#b5e1f5 1.2px, transparent 1.2px);
      background-size: 22px 22px;
      font-family: "DM Sans", sans-serif;
    }

    button { font: inherit; }

    .game {
      width: min(100%, 940px);
      overflow: hidden;
      border: 1px solid rgba(45, 99, 130, .14);
      border-radius: 14px;
      background: var(--white);
      box-shadow: 0 24px 70px rgba(49, 116, 147, .16), 0 4px 12px rgba(49, 116, 147, .08);
      animation: arrive .55s cubic-bezier(.2,.8,.2,1) both;
    }

    .topbar {
      min-height: 92px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 18px 30px;
      border-bottom: 1px solid #eaf0f1;
    }

    .brand { display: flex; align-items: center; gap: 13px; }

    .brand-mark {
      width: 42px;
      height: 48px;
      flex: 0 0 auto;
      filter: drop-shadow(0 3px 2px rgba(24, 50, 75, .12));
    }

    .brand-name {
      margin: 0;
      font-family: Fraunces, Georgia, serif;
      font-size: 23px;
      font-weight: 800;
      line-height: 1;
    }

    .brand-subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .stats { display: flex; align-items: center; gap: 10px; }

    .stat {
      min-width: 94px;
      padding: 9px 13px 8px;
      border-radius: 8px;
      background: #f3f8fa;
      text-align: center;
    }

    .stat-label {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .stat-value {
      display: block;
      margin-top: 1px;
      font-size: 20px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
    }

    .stat.timer { background: #fff2df; }
    .stat.timer .stat-value { color: #d47d2f; }

    .stage {
      position: relative;
      height: clamp(390px, 60vh, 560px);
      min-height: 390px;
      overflow: hidden;
      isolation: isolate;
      background: linear-gradient(180deg, #c9eeff 0%, #e6f8ff 76%, #f8fdff 100%);
      touch-action: manipulation;
    }

    .stage::before, .stage::after {
      position: absolute;
      z-index: -1;
      bottom: -95px;
      width: 64%;
      height: 180px;
      border-radius: 50% 50% 0 0;
      content: "";
      background: #d1f0db;
    }

    .stage::before { left: -12%; transform: rotate(-5deg); }
    .stage::after { right: -14%; bottom: -112px; background: #c1e9d1; transform: rotate(5deg); }

    .sun {
      position: absolute;
      top: 30px;
      right: 9%;
      width: 72px;
      aspect-ratio: 1;
      border: 8px solid rgba(255, 255, 255, .48);
      border-radius: 50%;
      background: #ffdb78;
      box-shadow: 0 0 0 12px rgba(255, 255, 255, .2);
      pointer-events: none;
    }

    .cloud {
      position: absolute;
      top: 85px;
      left: 9%;
      width: 95px;
      height: 25px;
      border-radius: 30px;
      background: rgba(255, 255, 255, .74);
      pointer-events: none;
    }

    .cloud::before, .cloud::after {
      position: absolute;
      bottom: 7px;
      border-radius: 50%;
      background: inherit;
      content: "";
    }

    .cloud::before { left: 14px; width: 36px; height: 36px; }
    .cloud::after { right: 14px; width: 27px; height: 27px; }

    .balloon {
      position: absolute;
      z-index: 2;
      bottom: -120px;
      width: var(--size);
      height: calc(var(--size) * 1.24);
      padding: 0;
      border: 0;
      background: transparent;
      cursor: crosshair;
      touch-action: manipulation;
      animation: float-up var(--flight) linear forwards;
      transform-origin: 50% 80%;
    }

    .balloon svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .balloon:focus-visible { outline: 3px solid var(--ink); outline-offset: 5px; border-radius: 50%; }
    .balloon:hover { filter: brightness(1.06); }
    .balloon.popping { animation: pop .18s ease-out forwards; pointer-events: none; }

    .overlay {
      position: absolute;
      z-index: 5;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(225, 246, 255, .58);
      backdrop-filter: blur(4px);
    }

    .overlay[hidden] { display: none; }

    .dialog {
      width: min(100%, 400px);
      padding: 32px 28px 29px;
      border: 1px solid rgba(45, 99, 130, .12);
      border-radius: 12px;
      background: rgba(255, 254, 250, .97);
      box-shadow: 0 16px 42px rgba(49, 116, 147, .18);
      text-align: center;
      animation: dialog-in .35s cubic-bezier(.2,.8,.2,1) both;
    }

    .party-balloons {
      display: block;
      width: 168px;
      height: 112px;
      margin: -4px auto 12px;
    }

    .dialog h2 {
      margin: 0;
      font-family: Fraunces, Georgia, serif;
      font-size: 37px;
      font-weight: 800;
      line-height: 1.08;
    }

    .dialog p {
      margin: 10px auto 22px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .primary-button {
      min-height: 48px;
      min-width: 174px;
      padding: 12px 22px;
      border: 0;
      border-radius: 8px;
      background: var(--coral);
      box-shadow: 0 4px 0 #d94f46;
      color: white;
      cursor: pointer;
      font-size: 15px;
      font-weight: 800;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }

    .primary-button:hover { background: #f45e52; transform: translateY(-2px); box-shadow: 0 6px 0 #d94f46; }
    .primary-button:active { transform: translateY(2px); box-shadow: 0 2px 0 #d94f46; }
    .primary-button:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }

    .combo {
      position: absolute;
      z-index: 3;
      color: #fff;
      font-family: Fraunces, Georgia, serif;
      font-size: 24px;
      font-weight: 800;
      text-shadow: 0 2px 5px rgba(24, 50, 75, .34);
      pointer-events: none;
      animation: combo-up .65s ease-out forwards;
    }

    .footer {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .footer-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--mint); }

    @keyframes arrive { from { opacity: 0; transform: translateY(12px) scale(.99); } to { opacity: 1; transform: none; } }
    @keyframes dialog-in { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }
    @keyframes float-up {
      0% { bottom: -125px; transform: translateX(0) rotate(-5deg); }
      50% { transform: translateX(var(--drift)) rotate(5deg); }
      100% { bottom: calc(100% + 135px); transform: translateX(0) rotate(-4deg); }
    }
    @keyframes pop { to { opacity: 0; transform: scale(1.5); } }
    @keyframes combo-up { to { opacity: 0; transform: translateY(-36px) scale(1.15); } }

    @media (max-width: 560px) {
      body { padding: 12px; }
      .game { border-radius: 10px; }
      .topbar { min-height: 76px; gap: 10px; padding: 12px 14px; }
      .brand { gap: 8px; }
      .brand-mark { width: 32px; height: 38px; }
      .brand-name { font-size: 19px; }
      .brand-subtitle { font-size: 10px; }
      .stats { gap: 6px; }
      .stat { min-width: 66px; padding: 7px 8px; }
      .stat-label { font-size: 9px; }
      .stat-value { font-size: 18px; }
      .stage { height: min(66vh, 560px); min-height: 390px; }
      .sun { top: 23px; right: 8%; width: 54px; border-width: 6px; }
      .cloud { top: 77px; left: 6%; transform: scale(.8); transform-origin: left; }
      .dialog { padding: 26px 20px 24px; }
      .dialog h2 { font-size: 33px; }
      .footer { min-height: 42px; font-size: 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="game" aria-label="Pop Balloon Party game">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 50 58" aria-hidden="true">
          <path d="M25 45c-3 0-5 3-2 5l2 2 2-2c3-2 1-5-2-5Z" fill="#ff6f61"/>
          <path d="M25 51c1 3-2 4 0 7" fill="none" stroke="#7796a4" stroke-width="1.5"/>
          <path d="M25 3C14 3 7 11 7 22c0 12 9 23 18 23s18-11 18-23C43 11 36 3 25 3Z" fill="#ff6f61"/>
          <ellipse cx="17" cy="15" rx="4" ry="7" fill="#fff" opacity=".55" transform="rotate(-28 17 15)"/>
        </svg>
        <div>
          <h1 class="brand-name">Pop! Party</h1>
          <p class="brand-subtitle">A little burst of fun</p>
        </div>
      </div>
      <div class="stats" aria-label="Game stats">
        <div class="stat"><span class="stat-label">Score</span><span class="stat-value" id="score">0</span></div>
        <div class="stat timer"><span class="stat-label">Time</span><span class="stat-value" id="time">30</span></div>
      </div>
    </header>

    <section class="stage" id="stage" aria-label="Balloon popping play area">
      <div class="sun" aria-hidden="true"></div>
      <div class="cloud" aria-hidden="true"></div>
      <div class="overlay" id="overlay">
        <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-description">
          <svg class="party-balloons" viewBox="0 0 180 120" aria-hidden="true">
            <path d="M42 82c-1 12 8 17 8 29m44-34c-2 11 5 17 4 30m41-24c-2 10 4 17 2 25" fill="none" stroke="#9aabb0" stroke-width="1.5"/>
            <path d="M50 67c-3 0-5 4-2 6l3 2 3-2c3-2 1-6-4-6Z" fill="#ffc94f"/>
            <path d="M94 68c-3 0-5 4-2 6l3 2 3-2c3-2 1-6-4-6Z" fill="#56c9a6"/>
            <path d="M137 62c-3 0-5 4-2 6l3 2 3-2c3-2 1-6-4-6Z" fill="#9a83e9"/>
            <path d="M51 10c-12 0-20 9-20 23 0 15 10 30 20 30s20-15 20-30C71 19 63 10 51 10Z" fill="#ffc94f"/>
            <ellipse cx="42" cy="24" rx="4" ry="8" fill="#fff" opacity=".58" transform="rotate(-28 42 24)"/>
            <path d="M95 11c-12 0-20 9-20 23 0 15 10 30 20 30s20-15 20-30C115 20 107 11 95 11Z" fill="#56c9a6"/>
            <ellipse cx="86" cy="25" rx="4" ry="8" fill="#fff" opacity=".58" transform="rotate(-28 86 25)"/>
            <path d="M138 5c-12 0-20 9-20 23 0 15 10 30 20 30s20-15 20-30C158 14 150 5 138 5Z" fill="#9a83e9"/>
            <ellipse cx="129" cy="19" rx="4" ry="8" fill="#fff" opacity=".58" transform="rotate(-28 129 19)"/>
            <path d="m19 28 2 5 5 .7-3.6 3.5.8 5-4.2-2.5-4.3 2.5.9-5-3.7-3.5 5-.7z" fill="#ff8a74"/>
            <path d="m165 76 1.7 4.1 4.4.6-3.2 3 .8 4.3-3.7-2.1-3.8 2.1.8-4.3-3.1-3 4.3-.6z" fill="#ed7fac"/>
          </svg>
          <h2 id="dialog-title">Ready, set, pop!</h2>
          <p id="dialog-description">Pop as many balloons as you can before the party timer runs out.</p>
          <button class="primary-button" id="start-button" type="button">Start popping</button>
        </div>
      </div>
    </section>

    <footer class="footer" aria-live="polite"><span class="footer-dot" aria-hidden="true"></span><span id="status">Tap or click a balloon to pop it</span></footer>
  </main>

  <script>
    const stage = document.querySelector("#stage");
    const scoreDisplay = document.querySelector("#score");
    const timeDisplay = document.querySelector("#time");
    const overlay = document.querySelector("#overlay");
    const title = document.querySelector("#dialog-title");
    const description = document.querySelector("#dialog-description");
    const startButton = document.querySelector("#start-button");
    const status = document.querySelector("#status");
    const colors = [
      { fill: "#ff6f61", shine: "#ffd4ce" },
      { fill: "#4c91ed", shine: "#d4e8ff" },
      { fill: "#ffc94f", shine: "#fff0bd" },
      { fill: "#56c9a6", shine: "#d1f5e9" },
      { fill: "#ed7fac", shine: "#ffe0eb" },
      { fill: "#9a83e9", shine: "#e5defc" }
    ];

    let score = 0;
    let seconds = 30;
    let combo = 0;
    let lastPop = 0;
    let spawnTimer = 0;
    let lastFrame = 0;
    let running = false;
    let animationFrame = 0;
    let clockInterval = 0;

    function makeBalloon() {
      if (!running) return;
      const color = colors[Math.floor(Math.random() * colors.length)];
      const balloon = document.createElement("button");
      const size = 48 + Math.random() * 27;
      const flight = 4.5 + Math.random() * 2.1;
      balloon.type = "button";
      balloon.className = "balloon";
      balloon.setAttribute("aria-label", "Pop balloon for points");
      balloon.style.left = `${5 + Math.random() * 84}%`;
      balloon.style.setProperty("--size", `${size}px`);
      balloon.style.setProperty("--flight", `${flight}s`);
      balloon.style.setProperty("--drift", `${Math.round(Math.random() * 40 - 20)}px`);
      balloon.innerHTML = `<svg viewBox="0 0 80 100" aria-hidden="true"><path d="M40 76c-4 0-6 4-2 7l2 2 2-2c4-3 2-7-2-7Z" fill="${color.fill}"/><path d="M40 84c2 5-3 8 0 14" fill="none" stroke="#849ca2" stroke-width="1.4"/><path d="M40 4C19 4 6 19 6 40c0 23 15 43 34 43s34-20 34-43C74 19 61 4 40 4Z" fill="${color.fill}"/><ellipse cx="24" cy="23" rx="5" ry="10" fill="${color.shine}" opacity=".8" transform="rotate(-28 24 23)"/></svg>`;
      balloon.addEventListener("click", () => popBalloon(balloon));
      stage.append(balloon);
    }

    function popBalloon(balloon) {
      if (!running || balloon.classList.contains("popping")) return;
      const now = performance.now();
      combo = now - lastPop < 1500 ? combo + 1 : 1;
      lastPop = now;
      score += combo > 1 ? 15 : 10;
      scoreDisplay.textContent = score;
      status.textContent = combo > 1 ? `${combo} in a row! Keep it going!` : "Nice pop! Find another balloon.";
      const bounds = balloon.getBoundingClientRect();
      const stageBounds = stage.getBoundingClientRect();
      const burst = document.createElement("span");
      burst.className = "combo";
      burst.textContent = combo > 1 ? `+15  x${combo}` : "+10";
      burst.style.left = `${bounds.left - stageBounds.left + bounds.width / 2}px`;
      burst.style.top = `${bounds.top - stageBounds.top + bounds.height / 3}px`;
      stage.append(burst);
      balloon.classList.add("popping");
      balloon.addEventListener("animationend", () => balloon.remove(), { once: true });
      burst.addEventListener("animationend", () => burst.remove(), { once: true });
    }

    function finishGame() {
      running = false;
      window.cancelAnimationFrame(animationFrame);
      window.clearInterval(clockInterval);
      stage.querySelectorAll(".balloon").forEach(balloon => balloon.remove());
      title.textContent = "Party's over!";
      description.textContent = `You popped ${score} points worth of balloons. Ready for another round?`;
      startButton.textContent = "Play again";
      overlay.hidden = false;
      status.textContent = "Round complete. Great popping!";
      startButton.focus();
    }

    function tick(timestamp) {
      if (!running) return;
      const delta = timestamp - lastFrame;
      lastFrame = timestamp;
      spawnTimer += delta;
      const interval = Math.max(340, 760 - (30 - seconds) * 11);
      if (spawnTimer >= interval) {
        spawnTimer = 0;
        makeBalloon();
      }
      animationFrame = window.requestAnimationFrame(tick);
    }

    function startGame() {
      score = 0;
      seconds = 30;
      combo = 0;
      lastPop = 0;
      spawnTimer = 0;
      scoreDisplay.textContent = "0";
      timeDisplay.textContent = "30";
      status.textContent = "Tap or click a balloon to pop it";
      stage.querySelectorAll(".balloon, .combo").forEach(item => item.remove());
      overlay.hidden = true;
      running = true;
      lastFrame = performance.now();
      animationFrame = window.requestAnimationFrame(tick);
      makeBalloon();
      clockInterval = window.setInterval(() => {
        if (!running) return;
        seconds -= 1;
        timeDisplay.textContent = seconds;
        if (seconds <= 0) finishGame();
      }, 1000);
    }

    startButton.addEventListener("click", startGame);
  </script>
</body>
</html>
